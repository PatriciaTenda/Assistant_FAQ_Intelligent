name: Tests API

on: # Événements qui déclenchent le workflow
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest # Système d'exploitation du runner
    env: 
      token_benchmark_faq: token-test
    steps:
    - name: récupérer le projet
      uses: actions/checkout@v6 # Action à utiliser

    - name: installer python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10" # Version de Python à utiliser
    
    - name: installer les dependences
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    - name: exécuter les tests
      run: python -m pytest src/tests -v # Commande shell à exécuter